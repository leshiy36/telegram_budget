<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер бюджета & Аналитика</title>
  <!-- Chart.js для инфографики -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    /* Информационные плашки */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .text-green { color: var(--success); }
    .text-red { color: var(--danger); }
    .text-blue { color: var(--accent); }

    /* Предупреждение */
    .alert-banner {
      display: none;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      border: 1px solid transparent;
      animation: fadeIn 0.3s ease-in-out;
    }

    .alert-warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--warning);
      color: #fbbf24;
    }

    .alert-danger {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: #f87171;
    }

    /* Формы ввода */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: #0b1324;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #0b1324;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 11px 16px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Список расходов */
    .expense-list {
      max-height: 380px;
      overflow-y: auto;
      list-style: none;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .item-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      background: #334155;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      width: auto;
      padding: 4px 8px;
      font-size: 1.1rem;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Верхняя сводка и предупреждения -->
    <div class="card full-width">
      <div id="budgetAlert" class="alert-banner"></div>
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Доход / Зарплата</div>
          <div class="metric-value text-green" id="dispIncome">0 ₽</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Сумма расходов</div>
          <div class="metric-value text-red" id="dispExpenses">0 ₽</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Остаток баланса</div>
          <div class="metric-value text-blue" id="dispBalance">0 ₽</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Расход бюджета</div>
          <div class="metric-value" id="dispPercent">0%</div>
        </div>
      </div>
    </div>

    <!-- Блок ввода дохода и трат -->
    <div class="card">
      <h2>Управление бюджетом</h2>
      
      <!-- Форма дохода -->
      <form id="incomeForm" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
        <div class="form-group">
          <label>Текущий доход / Зарплата (₽)</label>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="incomeInput" placeholder="Например: 60000" min="0" required>
            <button type="submit" style="width: 120px;">Задать</button>
          </div>
        </div>
      </form>

      <!-- Форма расходов -->
      <form id="expenseForm">
        <div class="form-group">
          <label>Описание расхода</label>
          <input type="text" id="expDesc" placeholder="Например: Аренда, Такси" required>
        </div>
        <div class="form-group">
          <label>Сумма (₽)</label>
          <input type="number" id="expAmount" placeholder="Например: 1500" min="1" required>
        </div>
        <div class="form-group">
          <label>Категория (выберите или введите свою)</label>
          <input list="categoryList" id="expCategory" placeholder="Начните вводить или выберите..." required>
          <datalist id="categoryList">
            <option value="Продукты">
            <option value="Жилье и ЖКХ">
            <option value="Транспорт">
            <option value="Развлечения">
            <option value="Здоровье">
          </datalist>
        </div>
        <button type="submit">Добавить расход</button>
      </form>
    </div>

    <!-- Инфографика (Диаграмма) -->
    <div class="card">
      <h2>Аналитика категорий</h2>
      <div class="chart-box">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <!-- История операций -->
    <div class="card full-width">
      <h2>История расходов</h2>
      <ul class="expense-list" id="expenseList">
        <!-- Расходы рендерятся скриптом -->
      </ul>
    </div>
  </div>

  <script>
    // Инициализация структуры данных из LocalStorage
    let state = {
      income: Number(localStorage.getItem('budget_income')) || 0,
      expenses: JSON.parse(localStorage.getItem('budget_expenses')) || []
    };

    let chartInstance = null;

    // Ссылки на DOM
    const dispIncome = document.getElementById('dispIncome');
    const dispExpenses = document.getElementById('dispExpenses');
    const dispBalance = document.getElementById('dispBalance');
    const dispPercent = document.getElementById('dispPercent');
    const budgetAlert = document.getElementById('budgetAlert');
    const expenseList = document.getElementById('expenseList');
    const categoryDatalist = document.getElementById('categoryList');

    // Форматирование чисел в рубли
    const formatRub = (num) => new Intl.NumberFormat('ru-RU').format(Math.round(num)) + ' ₽';

    function saveData() {
      localStorage.setItem('budget_income', state.income);
      localStorage.setItem('budget_expenses', JSON.stringify(state.expenses));
    }

    // Обновление всей логики и предупреждений
    function updateApp() {
      const totalExpense = state.expenses.reduce((acc, cur) => acc + cur.amount, 0);
      const balance = state.income - totalExpense;
      const spentPercent = state.income > 0 ? (totalExpense / state.income) * 100 : 0;

      // Обновление текстовых значений
      dispIncome.textContent = formatRub(state.income);
      dispExpenses.textContent = formatRub(totalExpense);
      dispBalance.textContent = formatRub(balance);
      dispPercent.textContent = Math.round(spentPercent) + '%';

      // Логика системы раннего предупреждения
      budgetAlert.className = 'alert-banner';
      if (state.income > 0) {
        if (totalExpense >= state.income) {
          budgetAlert.classList.add('alert-danger');
          budgetAlert.textContent = `Внимание! Расходы превысили доход на ${formatRub(totalExpense - state.income)}! Баланс отрицательный.`;
        } else if (spentPercent >= 80) {
          budgetAlert.classList.add('alert-warning');
          budgetAlert.textContent = `Осторожно! Израсходовано уже ${Math.round(spentPercent)}% бюджета. Расходы приближаются к лимиту!`;
        }
      }

      // Обновление категорий в datalist
      updateCategoriesList();
      // Отрисовка списка расходов
      renderExpensesList();
      // Перерисовка диаграммы
      renderChart();
    }

    function updateCategoriesList() {
      const defaultCategories = ['Продукты', 'Жилье и ЖКХ', 'Транспорт', 'Развлечения', 'Здоровье'];
      const customCategories = state.expenses.map(e => e.category);
      const allUnique = [...new Set([...defaultCategories, ...customCategories])];

      categoryDatalist.innerHTML = allUnique.map(cat => `<option value="${cat}">`).join('');
    }

    function renderExpensesList() {
      if (state.expenses.length === 0) {
        expenseList.innerHTML = `<li style="color: var(--text-muted); text-align: center; padding: 20px;">Расходов пока нет</li>`;
        return;
      }

      expenseList.innerHTML = state.expenses.map((exp, idx) => `
        <li class="expense-item">
          <div>
            <strong>${exp.desc}</strong>
            <span class="item-cat">${exp.category}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-weight: 600;">${formatRub(exp.amount)}</span>
            <button class="btn-del" onclick="deleteExpense(${idx})" title="Удалить">✕</button>
          </div>
        </li>
      `).reverse().join('');
    }

    window.deleteExpense = function(index) {
      state.expenses.splice(index, 1);
      saveData();
      updateApp();
    };

    function renderChart() {
      // Группировка расходов по категориям
      const catTotals = {};
      state.expenses.forEach(e => {
        catTotals[e.category] = (catTotals[e.category] || 0) + e.amount;
      });

      const labels = Object.keys(catTotals);
      const data = Object.values(catTotals);

      const ctx = document.getElementById('categoryChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (labels.length === 0) {
        // Заглушка, если данных нет
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Нет расходов'],
            datasets: [{ data: [1], backgroundColor: ['#334155'] }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });
        return;
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              '#38bdf8', '#f43f5e', '#10b981', '#f59e0b', 
              '#a855f7', '#ec4899', '#6366f1', '#14b8a6'
            ],
            borderColor: '#1e293b',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { size: 11 } }
            }
          }
        }
      });
    }

    // Слушатель установки дохода
    document.getElementById('incomeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = Number(document.getElementById('incomeInput').value);
      if (val >= 0) {
        state.income = val;
        saveData();
        updateApp();
        document.getElementById('incomeInput').value = '';
      }
    });

    // Слушатель добавления расхода
    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const desc = document.getElementById('expDesc').value.trim();
      const amount = Number(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value.trim();

      if (desc && amount > 0 && category) {
        state.expenses.push({ desc, amount, category, date: new Date().toISOString() });
        saveData();
        updateApp();

        // Сброс полей
        document.getElementById('expDesc').value = '';
        document.getElementById('expAmount').value = '';
        document.getElementById('expCategory').value = '';
      }
    });

    // Стартовая инициализация
    updateApp();
  </script>
</body>
</html>
