<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бюджет</title>
  <!-- Telegram WebApp SDK & Chart.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --btn-text: var(--tg-theme-button-text-color, #0f172a);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }

    .month-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .month-bar input[type="month"] { background: rgba(0,0,0,0.25); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; outline: none; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric-card { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .metric-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .metric-value { font-size: 1.15rem; font-weight: 700; }
    .text-green { color: var(--success); }
    .text-red { color: var(--danger); }
    .text-blue { color: var(--accent); }

    .alert-banner { display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; font-weight: 500; }
    .alert-warning { display: block; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid var(--warning); }
    .alert-danger { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid var(--danger); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    input { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 0.9rem; outline: none; }
    
    button.btn-primary { background: var(--accent); color: var(--btn-text); font-weight: 600; border: none; border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; }
    button.btn-primary:active { opacity: 0.85; }

    .chart-box { position: relative; width: 100%; height: 240px; margin-top: 6px; }

    .item-list { list-style: none; max-height: 280px; overflow-y: auto; margin-top: 10px; }
    .record-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .record-item:last-child { border-bottom: none; }
    .item-cat { font-size: 0.7rem; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; }
    .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px 8px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="month-bar">
        <strong>Период</strong>
        <input type="month" id="selectedMonth">
      </div>
      <div id="budgetAlert" class="alert-banner"></div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-title">Доходы</div><div class="metric-value text-green" id="dispIncome">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Расходы</div><div class="metric-value text-red" id="dispExpenses">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Остаток</div><div class="metric-value text-blue" id="dispBalance">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Расход %</div><div class="metric-value" id="dispPercent">0%</div></div>
      </div>
    </div>

    <!-- Форма расхода -->
    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 10px;">Внести расход</h3>
      <form id="expForm">
        <div class="form-row">
          <div><label>Сумма (₽)</label><input type="number" id="expAmount" required min="1"></div>
          <div><label>Дата</label><input type="date" id="expDate" required></div>
        </div>
        <div class="form-row">
          <div><label>Категория</label><input list="catList" id="expCategory" placeholder="Выбор/своя" required></div>
          <div><label>Описание</label><input type="text" id="expDesc" placeholder="Такси, кофе..." required></div>
        </div>
        <datalist id="catList"><option value="Продукты"><option value="Жилье"><option value="Транспорт"><option value="Развлечения"><option value="Здоровье"></datalist>
        <button type="submit" class="btn-primary" id="expBtn">Записать расход</button>
      </form>
    </div>

    <!-- Форма дохода -->
    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 10px;">Внести доход / Зарплату</h3>
      <form id="incForm">
        <div class="form-row">
          <div><label>Сумма (₽)</label><input type="number" id="incAmount" required min="1"></div>
          <div><label>Дата</label><input type="date" id="incDate" required></div>
        </div>
        <div class="form-group"><label>Источник</label><input type="text" id="incDesc" placeholder="Зарплата, аванс, бонус" required></div>
        <button type="submit" class="btn-primary" id="incBtn">Записать доход</button>
      </form>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 6px;">Структура расходов</h3>
      <div class="chart-box"><canvas id="catChart"></canvas></div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 6px;">Динамика месяцев</h3>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 8px;">Операции за месяц</h3>
      <ul class="item-list" id="operationsList">Загрузка данных...</ul>
    </div>
  </div>

  <script>
    // ВСТАВЬТЕ СЮДА ВАШ URL ИЗ ШАГА 1
    const API_URL = "https://script.google.com/macros/s/AKfycbywEeQmKtOoZSOyjhcVnCtCQbXbH524I2xYs3PNusXUxHlH6Oo9HRakZ5HU4_bwid2WbQ/exec";

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const todayStr = new Date().toISOString().slice(0, 10);
    const monthStr = todayStr.slice(0, 7);

    let state = {
      incomes: [],
      expenses: [],
      selectedMonth: monthStr
    };

    document.getElementById('selectedMonth').value = monthStr;
    document.getElementById('expDate').value = todayStr;
    document.getElementById('incDate').value = todayStr;

    let catChart = null;
    let trendChart = null;
    const formatRub = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        state.incomes = data.incomes || [];
        state.expenses = data.expenses || [];
        updateUI();
      } catch (e) {
        document.getElementById('operationsList').innerHTML = `<li style="color:var(--danger)">Ошибка загрузки из таблицы. Проверьте URL.</li>`;
      }
    }

    async function sendData(payload) {
      // Отправка через text/plain для обхода CORS preflight в Google Scripts
      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      });
      await loadData();
    }

    function updateUI() {
      const expenses = state.expenses.filter(e => e.date.startsWith(state.selectedMonth));
      const incomes = state.incomes.filter(i => i.date.startsWith(state.selectedMonth));

      const totalInc = incomes.reduce((s, i) => s + i.amount, 0);
      const totalExp = expenses.reduce((s, e) => s + e.amount, 0);
      const balance = totalInc - totalExp;
      const spentPercent = totalInc > 0 ? (totalExp / totalInc) * 100 : 0;

      document.getElementById('dispIncome').textContent = formatRub(totalInc);
      document.getElementById('dispExpenses').textContent = formatRub(totalExp);
      document.getElementById('dispBalance').textContent = formatRub(balance);
      document.getElementById('dispPercent').textContent = Math.round(spentPercent) + '%';

      const alert = document.getElementById('budgetAlert');
      alert.className = 'alert-banner';
      if (totalInc > 0) {
        if (totalExp >= totalInc) {
          alert.classList.add('alert-danger');
          alert.textContent = `Внимание! Расходы превысили доход на ${formatRub(totalExp - totalInc)}!`;
        } else if (spentPercent >= 80) {
          alert.classList.add('alert-warning');
          alert.textContent = `Осторожно! Израсходовано ${Math.round(spentPercent)}% доходов за месяц!`;
        }
      }

      renderList(expenses, incomes);
      renderCharts(expenses);
    }

    function renderList(expenses, incomes) {
      const allOps = [
        ...expenses.map((e, idx) => ({ ...e, type: 'expenses', origIdx: idx })),
        ...incomes.map((i, idx) => ({ ...i, type: 'incomes', origIdx: idx }))
      ].sort((a, b) => new Date(b.date) - new Date(a.date));

      const list = document.getElementById('operationsList');
      if (allOps.length === 0) {
        list.innerHTML = `<li style="color:var(--text-muted); text-align:center; padding:10px;">Нет записей</li>`;
        return;
      }

      list.innerHTML = allOps.map(item => `
        <li class="record-item">
          <div>
            <span style="font-size:0.75rem; color:var(--text-muted); margin-right:6px;">${item.date.slice(5)}</span>
            <strong>${item.desc}</strong>
            ${item.category ? `<span class="item-cat">${item.category}</span>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:600; color: ${item.type === 'expenses' ? 'var(--danger)' : 'var(--success)'}">
              ${item.type === 'expenses' ? '-' : '+'}${formatRub(item.amount)}
            </span>
            <button class="btn-del" onclick="deleteRecord('${item.type}', ${item.origIdx})">✕</button>
          </div>
        </li>
      `).join('');
    }

    window.deleteRecord = async function(type, index) {
      if (confirm('Удалить эту строку?')) {
        await sendData({ action: "delete_item", type, index });
      }
    };

    function renderCharts(monthExpenses) {
      // Круговая
      const catTotals = {};
      monthExpenses.forEach(e => catTotals[e.category] = (catTotals[e.category] || 0) + e.amount);
      const ctx1 = document.getElementById('catChart').getContext('2d');
      if (catChart) catChart.destroy();
      catChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catTotals),
          datasets: [{ data: Object.values(catTotals), backgroundColor: ['#38bdf8', '#f43f5e', '#10b981', '#f59e0b', '#a855f7', '#6366f1'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } } }
      });

      // Линейная (тренды)
      const allMonths = [...new Set([...state.incomes.map(i => i.date.slice(0,7)), ...state.expenses.map(e => e.date.slice(0,7))])].sort();
      const incData = allMonths.map(m => state.incomes.filter(i => i.date.startsWith(m)).reduce((s,i) => s + i.amount, 0));
      const expData = allMonths.map(m => state.expenses.filter(e => e.date.startsWith(m)).reduce((s,e) => s + e.amount, 0));

      const ctx2 = document.getElementById('trendChart').getContext('2d');
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(ctx2, {
        type: 'line',
        data: {
          labels: allMonths,
          datasets: [
            { label: 'Доход', data: incData, borderColor: '#22c55e', tension: 0.2 },
            { label: 'Расход', data: expData, borderColor: '#ef4444', tension: 0.2 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } },
          plugins: { legend: { labels: { color: '#94a3b8' } } }
        }
      });
    }

    // Слушатели событий
    document.getElementById('selectedMonth').addEventListener('change', (e) => {
      state.selectedMonth = e.target.value;
      updateUI();
    });

    document.getElementById('expForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('expBtn');
      btn.textContent = 'Сохранение...';
      btn.disabled = true;

      await sendData({
        action: "add_expense",
        amount: Number(document.getElementById('expAmount').value),
        date: document.getElementById('expDate').value,
        category: document.getElementById('expCategory').value,
        desc: document.getElementById('expDesc').value
      });

      document.getElementById('expAmount').value = '';
      document.getElementById('expDesc').value = '';
      btn.textContent = 'Записать расход';
      btn.disabled = false;
    });

    document.getElementById('incForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('incBtn');
      btn.textContent = 'Сохранение...';
      btn.disabled = true;

      await sendData({
        action: "add_income",
        amount: Number(document.getElementById('incAmount').value),
        date: document.getElementById('incDate').value,
        desc: document.getElementById('incDesc').value
      });

      document.getElementById('incAmount').value = '';
      document.getElementById('incDesc').value = '';
      btn.textContent = 'Записать доход';
      btn.disabled = false;
    });

    loadData();
  </script>
</body>
</html>
