<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Бюджет & Капитал</title>
  <!-- Telegram WebApp SDK & Chart.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --btn-text: var(--tg-theme-button-text-color, #0f172a);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }

    /* Панель периода и статуса сети */
    .month-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .month-controls { display: flex; align-items: center; gap: 8px; }
    .month-bar input[type="month"] { background: rgba(0,0,0,0.25); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; outline: none; }

    .sync-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    /* Главный блок капитала */
    .total-balance-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(30, 41, 59, 0.7) 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .balance-header { font-size: 0.85rem; color: var(--text-muted); }
    .balance-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .balance-amount { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }

    /* Бейдж точной дельты */
    .delta-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-plus { background: rgba(34, 197, 94, 0.18); color: #4ade80; border-color: rgba(34, 197, 94, 0.35); }
    .badge-minus { background: rgba(239, 68, 68, 0.18); color: #f87171; border-color: rgba(239, 68, 68, 0.35); }
    .badge-zero { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border-color: rgba(148, 163, 184, 0.25); }

    .start-balance-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.18);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .start-balance-row label { font-size: 0.8rem; color: var(--text-muted); flex: 1; margin: 0; }
    .start-balance-row input { width: 130px; padding: 6px 8px; font-size: 0.9rem; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric-card { background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .metric-title { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .metric-value { font-size: 1.15rem; font-weight: 700; }
    .text-green { color: var(--success); }
    .text-red { color: var(--danger); }
    .text-blue { color: var(--accent); }

    .alert-banner { display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; font-weight: 500; }
    .alert-warning { display: block; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid var(--warning); }
    .alert-danger { display: block; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid var(--danger); }

    /* Быстрые чипы категорий */
    .quick-chips-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      flex: 1;
    }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .chip-btn:active {
      background: var(--accent);
      color: var(--btn-text);
      transform: scale(0.95);
    }
    .chip-add-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px dashed var(--accent);
      color: var(--accent);
      font-weight: 700;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .chip-add-btn:active {
      transform: scale(0.92);
      background: var(--accent);
      color: var(--btn-text);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    input { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; color: var(--text); font-size: 0.9rem; outline: none; }
    
    button.btn-primary { background: var(--accent); color: var(--btn-text); font-weight: 600; border: none; border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; transition: opacity 0.15s; }
    button.btn-primary:active { opacity: 0.85; }

    .btn-reset {
      background: transparent;
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-reset:hover { background: rgba(239, 68, 68, 0.1); }

    .chart-box { position: relative; width: 100%; height: 240px; margin-top: 6px; }

    .item-list { list-style: none; max-height: 280px; overflow-y: auto; margin-top: 10px; }
    .record-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .record-item:last-child { border-bottom: none; }
    .item-cat { font-size: 0.7rem; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; margin-left: 6px; text-transform: uppercase; }
    .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px 8px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="month-bar">
        <div class="month-controls">
          <strong>Период</strong>
          <input type="month" id="selectedMonth">
        </div>
        <div class="sync-status" id="syncStatus">🟢 В облаке</div>
      </div>

      <!-- Главный блок капитала -->
      <div class="total-balance-box">
        <div class="balance-header">Общий баланс средств</div>
        <div class="balance-row">
          <div class="balance-amount" id="dispTotalCapital">0 ₽</div>
          <div class="delta-badge badge-zero" id="deltaBadge">0 ₽</div>
        </div>
      </div>

      <!-- Ввод остатка на начало месяца -->
      <div class="start-balance-row">
        <label for="startBalanceInput">На начало месяца (₽):</label>
        <input type="number" id="startBalanceInput" placeholder="0" min="0">
        <button type="button" class="btn-primary" style="width: auto; padding: 6px 14px;" onclick="saveStartBalance()">ОК</button>
      </div>

      <div id="budgetAlert" class="alert-banner"></div>

      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-title">Доходы за месяц</div><div class="metric-value text-green" id="dispIncome">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Траты за месяц</div><div class="metric-value text-red" id="dispExpenses">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Свободный остаток</div><div class="metric-value text-blue" id="dispBalance">0 ₽</div></div>
        <div class="metric-card"><div class="metric-title">Расход %</div><div class="metric-value" id="dispPercent">0%</div></div>
      </div>
    </div>

    <!-- Внесение расхода с быстрыми чипами и кнопкой добавления новых -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="font-size: 1rem;">Внести расход</h3>
        <span style="font-size: 0.72rem; color: var(--text-muted);">Зажмите чип для удаления</span>
      </div>

      <!-- Лента чипов с плюсиком -->
      <div class="quick-chips-wrapper">
        <div class="quick-chips" id="chipsContainer"></div>
        <button type="button" class="chip-add-btn" onclick="promptAddNewCategory()" title="Добавить новую категорию">+ Новая</button>
      </div>

      <form id="expForm">
        <div class="form-row">
          <div>
            <label>Сумма (₽) или калькулятор</label>
            <input type="text" id="expAmount" placeholder="350 или 200+150" required inputmode="numeric">
          </div>
          <div><label>Дата</label><input type="date" id="expDate" required></div>
        </div>
        <div class="form-row">
          <div><label>Категория</label><input list="catList" id="expCategory" placeholder="Выбор/своя" required></div>
          <div><label>Описание</label><input type="text" id="expDesc" placeholder="Такси, кафе..." required></div>
        </div>
        <datalist id="catList"></datalist>
        <button type="submit" class="btn-primary" id="expBtn">Записать расход</button>
      </form>
    </div>

    <!-- Внесение дохода -->
    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 10px;">Внести доход / Зарплату</h3>
      <form id="incForm">
        <div class="form-row">
          <div><label>Сумма (₽)</label><input type="text" id="incAmount" placeholder="50000" required inputmode="numeric"></div>
          <div><label>Дата</label><input type="date" id="incDate" required></div>
        </div>
        <div class="form-group"><label>Источник</label><input type="text" id="incDesc" placeholder="Зарплата, аванс, бонус" required></div>
        <button type="submit" class="btn-primary" id="incBtn">Записать доход</button>
      </form>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 6px;">Структура расходов</h3>
      <div class="chart-box"><canvas id="catChart"></canvas></div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 6px;">Динамика и тенденции</h3>
      <div class="chart-box"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="card">
      <h3 style="font-size: 1rem; margin-bottom: 8px;">Операции за месяц</h3>
      <ul class="item-list" id="operationsList">Загрузка данных...</ul>
    </div>

    <div class="card" style="text-align: center;">
      <button type="button" class="btn-reset" onclick="confirmResetAll()">
        🗑 Сбросить все данные (доходы, расходы и баланс)
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbywEeQmKtOoZSOyjhcVnCtCQbXbH524I2xYs3PNusXUxHlH6Oo9HRakZ5HU4_bwid2WbQ/exec";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');
      } catch (e) {}
    }

    function hapticSuccess() {
      try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {}
    }
    function hapticLight() {
      try { tg?.HapticFeedback?.impactOccurred('light'); } catch (e) {}
    }
    function hapticWarning() {
      try { tg?.HapticFeedback?.notificationOccurred('warning'); } catch (e) {}
    }

    const todayStr = new Date().toISOString().slice(0, 10);
    const monthStr = todayStr.slice(0, 7);

    // Начальные дефолтные категории
    const DEFAULT_CATEGORIES = [
      { name: "Продукты", icon: "🛒" },
      { name: "Кофе", icon: "☕" },
      { name: "Транспорт", icon: "🚕" },
      { name: "Развлечения", icon: "🍔" },
      { name: "Жилье", icon: "🏠" },
      { name: "Здоровье", icon: "💊" }
    ];

    // Загрузка категорий из локального хранилища
    let savedCategories = JSON.parse(localStorage.getItem('budget_custom_categories')) || DEFAULT_CATEGORIES;

    let state = {
      incomes: JSON.parse(localStorage.getItem('budget_cached_incomes')) || [],
      expenses: JSON.parse(localStorage.getItem('budget_cached_expenses')) || [],
      selectedMonth: monthStr,
      startBalances: JSON.parse(localStorage.getItem('budget_start_balances')) || {}
    };

    let syncQueue = JSON.parse(localStorage.getItem('budget_sync_queue')) || [];
    let syncTimer = null;
    let isSyncing = false;
    const SYNC_TIMEOUT_MS = 3500;

    document.getElementById('selectedMonth').value = monthStr;
    document.getElementById('expDate').value = todayStr;
    document.getElementById('incDate').value = todayStr;

    let catChart = null;
    let trendChart = null;
    const formatRub = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';

    function evalAmountInput(val) {
      if (!val) return 0;
      const clean = String(val).replace(/,/g, '.').replace(/[^\d.+\-*/()]/g, '');
      try {
        const res = Function(`"use strict"; return (${clean})`)();
        return isFinite(res) && res > 0 ? Math.round(res) : 0;
      } catch (e) {
        return Number(clean) || 0;
      }
    }

    // Рендер чипов и обновление datalist
    function renderCategoryChips() {
      const container = document.getElementById('chipsContainer');
      const datalist = document.getElementById('catList');

      container.innerHTML = savedCategories.map((c, idx) => `
        <button type="button" class="chip-btn" 
          onclick="selectQuickChip('${c.name}')" 
          oncontextmenu="handleDeleteCategory(event, ${idx})"
          ontouchstart="handleTouchStart(event, ${idx})"
          ontouchend="handleTouchEnd()">
          ${c.icon ? c.icon + ' ' : ''}${c.name}
        </button>
      `).join('');

      datalist.innerHTML = savedCategories.map(c => `<option value="${c.name}">`).join('');
    }

    // Добавление новой категории плюсиком
    function promptAddNewCategory() {
      hapticLight();
      const rawName = prompt("Введите название новой категории (например: Спорт, Подписки, Подарки):");
      if (!rawName) return;

      const trimmed = rawName.trim();
      if (!trimmed) return;

      // Проверка на дубликат
      if (savedCategories.some(c => c.name.toLowerCase() === trimmed.toLowerCase())) {
        alert("Такая категория уже есть!");
        return;
      }

      // Выбираем эмодзи или ставим дефолтный тег
      savedCategories.push({ name: trimmed, icon: "🏷" });
      localStorage.setItem('budget_custom_categories', JSON.stringify(savedCategories));
      renderCategoryChips();
      selectQuickChip(trimmed);
      hapticSuccess();
    }

    // Удаление категории
    let touchTimer = null;
    function handleTouchStart(e, idx) {
      touchTimer = setTimeout(() => {
        deleteCategoryPrompt(idx);
      }, 700);
    }
    function handleTouchEnd() {
      if (touchTimer) clearTimeout(touchTimer);
    }
    function handleDeleteCategory(e, idx) {
      e.preventDefault();
      deleteCategoryPrompt(idx);
    }
    function deleteCategoryPrompt(idx) {
      hapticWarning();
      const cat = savedCategories[idx];
      if (confirm(`Удалить категорию «${cat.name}» из быстрых чипов?`)) {
        savedCategories.splice(idx, 1);
        localStorage.setItem('budget_custom_categories', JSON.stringify(savedCategories));
        renderCategoryChips();
      }
    }

    function selectQuickChip(category) {
      hapticLight();
      document.getElementById('expCategory').value = category;
      const descInput = document.getElementById('expDesc');
      if (!descInput.value) {
        descInput.value = category;
      }
      document.getElementById('expAmount').focus();
    }

    function setSyncStatus(type) {
      const el = document.getElementById('syncStatus');
      if (type === 'synced') {
        el.innerHTML = '🟢 В облаке';
        el.style.color = '#4ade80';
      } else if (type === 'pending') {
        el.innerHTML = '🟡 Ожидание (3с)...';
        el.style.color = '#fbbf24';
      } else if (type === 'syncing') {
        el.innerHTML = '🔄 Синхронизация...';
        el.style.color = '#38bdf8';
      } else if (type === 'error') {
        el.innerHTML = '🔴 Ошибка сети';
        el.style.color = '#f87171';
      }
    }

    function saveLocalCache() {
      localStorage.setItem('budget_cached_incomes', JSON.stringify(state.incomes));
      localStorage.setItem('budget_cached_expenses', JSON.stringify(state.expenses));
      localStorage.setItem('budget_sync_queue', JSON.stringify(syncQueue));
    }

    function scheduleSync() {
      setSyncStatus('pending');
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(flushSyncQueue, SYNC_TIMEOUT_MS);
    }

    async function flushSyncQueue() {
      if (syncQueue.length === 0 || isSyncing) return;
      isSyncing = true;
      setSyncStatus('syncing');

      while (syncQueue.length > 0) {
        const task = syncQueue[0];
        try {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(task),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
          });
          syncQueue.shift();
          saveLocalCache();
        } catch (err) {
          console.error("Сетевая ошибка при отправке:", err);
          setSyncStatus('error');
          isSyncing = false;
          syncTimer = setTimeout(flushSyncQueue, 5000);
          return;
        }
      }

      isSyncing = false;
      setSyncStatus('synced');
    }

    function saveStartBalance() {
      hapticLight();
      const val = Number(document.getElementById('startBalanceInput').value) || 0;
      state.startBalances[state.selectedMonth] = val;
      localStorage.setItem('budget_start_balances', JSON.stringify(state.startBalances));
      updateUI();
    }

    async function loadData() {
      try {
        if (syncQueue.length > 0) await flushSyncQueue();
        const res = await fetch(API_URL);
        const data = await res.json();
        state.incomes = data.incomes || [];
        state.expenses = data.expenses || [];
        saveLocalCache();
        updateUI();
        setSyncStatus('synced');
      } catch (e) {
        setSyncStatus('error');
      }
    }

    function updateUI() {
      const expenses = state.expenses.filter(e => e.date.startsWith(state.selectedMonth));
      const incomes = state.incomes.filter(i => i.date.startsWith(state.selectedMonth));

      const totalInc = incomes.reduce((s, i) => s + i.amount, 0);
      const totalExp = expenses.reduce((s, e) => s + e.amount, 0);
      const netMonth = totalInc - totalExp;

      const startCapital = state.startBalances[state.selectedMonth] || 0;
      document.getElementById('startBalanceInput').value = startCapital || '';

      const currentCapital = startCapital + netMonth;
      document.getElementById('dispTotalCapital').textContent = formatRub(currentCapital);

      const badge = document.getElementById('deltaBadge');
      if (netMonth > 0) {
        badge.className = 'delta-badge badge-plus';
        badge.textContent = `+${formatRub(netMonth)}`;
      } else if (netMonth < 0) {
        badge.className = 'delta-badge badge-minus';
        badge.textContent = `-${formatRub(Math.abs(netMonth))}`;
      } else {
        badge.className = 'delta-badge badge-zero';
        badge.textContent = '0 ₽';
      }

      const spentPercent = totalInc > 0 ? (totalExp / totalInc) * 100 : 0;
      document.getElementById('dispIncome').textContent = formatRub(totalInc);
      document.getElementById('dispExpenses').textContent = formatRub(totalExp);
      document.getElementById('dispBalance').textContent = formatRub(netMonth);
      document.getElementById('dispPercent').textContent = Math.round(spentPercent) + '%';

      const alert = document.getElementById('budgetAlert');
      alert.className = 'alert-banner';
      if (totalInc > 0) {
        if (totalExp >= totalInc) {
          alert.classList.add('alert-danger');
          alert.textContent = `Внимание! Траты превысили доходы месяца на ${formatRub(totalExp - totalInc)}!`;
        } else if (spentPercent >= 80) {
          alert.classList.add('alert-warning');
          alert.textContent = `Осторожно! Израсходовано ${Math.round(spentPercent)}% доходов за месяц!`;
        }
      }

      renderList(expenses, incomes);
      renderCharts(expenses);
    }

    function renderList(expenses, incomes) {
      const allOps = [
        ...expenses.map((e, idx) => ({ ...e, type: 'expenses', origIdx: idx })),
        ...incomes.map((i, idx) => ({ ...i, type: 'incomes', origIdx: idx }))
      ].sort((a, b) => new Date(b.date) - new Date(a.date));

      const list = document.getElementById('operationsList');
      if (allOps.length === 0) {
        list.innerHTML = `<li style="color:var(--text-muted); text-align:center; padding:10px;">Нет записей</li>`;
        return;
      }

      list.innerHTML = allOps.map(item => `
        <li class="record-item">
          <div>
            <span style="font-size:0.75rem; color:var(--text-muted); margin-right:6px;">${item.date.slice(5)}</span>
            <strong>${item.desc}</strong>
            ${item.category ? `<span class="item-cat">${item.category}</span>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:600; color: ${item.type === 'expenses' ? 'var(--danger)' : 'var(--success)'}">
              ${item.type === 'expenses' ? '-' : '+'}${formatRub(item.amount)}
            </span>
            <button class="btn-del" onclick="deleteRecord('${item.type}', ${item.origIdx})">✕</button>
          </div>
        </li>
      `).join('');
    }

    window.deleteRecord = async function(type, index) {
      hapticWarning();
      if (!confirm('Удалить эту операцию?')) return;

      state[type].splice(index, 1);
      saveLocalCache();
      updateUI();

      syncQueue.push({ action: "delete_item", type, index });
      saveLocalCache();
      scheduleSync();
    };

    async function confirmResetAll() {
      hapticWarning();
      const confirmed = confirm("ВНИМАНИЕ!\nВы уверены, что хотите полностью стереть все доходы, расходы и сохраненные начальные суммы?\nЭто действие нельзя отменить.");
      if (!confirmed) return;

      state.incomes = [];
      state.expenses = [];
      state.startBalances = {};
      syncQueue = [];
      localStorage.removeItem('budget_cached_incomes');
      localStorage.removeItem('budget_cached_expenses');
      localStorage.removeItem('budget_start_balances');
      localStorage.removeItem('budget_sync_queue');
      updateUI();

      setSyncStatus('syncing');
      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "reset_all" }),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
        setSyncStatus('synced');
        hapticSuccess();
        alert("Все данные успешно очищены.");
      } catch (err) {
        setSyncStatus('error');
      }
    }

    function renderCharts(monthExpenses) {
      const catTotals = {};
      monthExpenses.forEach(e => catTotals[e.category] = (catTotals[e.category] || 0) + e.amount);
      const ctx1 = document.getElementById('catChart').getContext('2d');
      if (catChart) catChart.destroy();
      catChart = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: Object.keys(catTotals),
          datasets: [{ data: Object.values(catTotals), backgroundColor: ['#38bdf8', '#f43f5e', '#10b981', '#f59e0b', '#a855f7', '#6366f1'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } } } }
      });

      const allMonths = [...new Set([...state.incomes.map(i => i.date.slice(0,7)), ...state.expenses.map(e => e.date.slice(0,7))])].sort();
      const incData = allMonths.map(m => state.incomes.filter(i => i.date.startsWith(m)).reduce((s,i) => s + i.amount, 0));
      const expData = allMonths.map(m => state.expenses.filter(e => e.date.startsWith(m)).reduce((s,e) => s + e.amount, 0));

      const ctx2 = document.getElementById('trendChart').getContext('2d');
      if (trendChart) trendChart.destroy();
      trendChart = new Chart(ctx2, {
        type: 'line',
        data: {
          labels: allMonths,
          datasets: [
            { label: 'Доход', data: incData, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', tension: 0.25 },
            { label: 'Расход', data: expData, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', tension: 0.25 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } },
          plugins: { legend: { labels: { color: '#94a3b8' } } }
        }
      });
    }

    document.getElementById('selectedMonth').addEventListener('change', (e) => {
      hapticLight();
      state.selectedMonth = e.target.value;
      updateUI();
    });

    document.getElementById('expForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rawAmount = document.getElementById('expAmount').value;
      const amount = evalAmountInput(rawAmount);

      if (!amount || amount <= 0) {
        alert("Пожалуйста, введите корректную сумму");
        return;
      }

      const date = document.getElementById('expDate').value;
      const category = document.getElementById('expCategory').value;
      const desc = document.getElementById('expDesc').value;

      state.expenses.push({ amount, date, category, desc });
      saveLocalCache();
      updateUI();

      hapticSuccess();

      document.getElementById('expAmount').value = '';
      document.getElementById('expDesc').value = '';

      syncQueue.push({ action: "add_expense", amount, date, category, desc });
      saveLocalCache();
      scheduleSync();
    });

    document.getElementById('incForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const rawAmount = document.getElementById('incAmount').value;
      const amount = evalAmountInput(rawAmount);

      if (!amount || amount <= 0) {
        alert("Пожалуйста, введите корректную сумму");
        return;
      }

      const date = document.getElementById('incDate').value;
      const desc = document.getElementById('incDesc').value;

      state.incomes.push({ amount, date, desc });
      saveLocalCache();
      updateUI();

      hapticSuccess();

      document.getElementById('incAmount').value = '';
      document.getElementById('incDesc').value = '';

      syncQueue.push({ action: "add_income", amount, date, desc });
      saveLocalCache();
      scheduleSync();
    });

    // Инициализация интерфейса
    renderCategoryChips();
    updateUI();
    if (syncQueue.length > 0) {
      scheduleSync();
    }
    loadData();
  </script>
</body>
</html>
